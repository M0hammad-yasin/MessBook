name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent two production deployments running simultaneously.
# New push cancels any pending (not yet started) deploy, but will wait for
# an already-running deploy to finish before starting, because we never
# want to race two Wrangler deployments against each other.
concurrency:
  group: messbook-production
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # Job A: Verify — NO production secrets exposed
  # ─────────────────────────────────────────────
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  # ─────────────────────────────────────────────
  # Job B: Deploy — only runs if verify succeeds
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy Worker to Cloudflare
    runs-on: ubuntu-latest
    needs: verify
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy to Cloudflare Workers
        # npm run deploy = opennextjs-cloudflare build && opennextjs-cloudflare deploy
        run: npm run deploy
