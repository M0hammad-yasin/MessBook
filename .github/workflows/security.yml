name: Security Audit

on:
  pull_request:
    branches:
      - main
  schedule:
    # Runs every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: npm dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit for high and critical vulnerabilities
        # Reports and fails on high/critical severity issues only.
        # We do NOT run `npm audit fix` or `npm audit fix --force` here.
        # Dependency upgrades must be a deliberate developer decision, not silent automation.
        run: npm audit --audit-level=high
